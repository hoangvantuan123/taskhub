syntax = "proto3";
package directory;
option go_package = "server-core/internal/directorypb";
import "google/protobuf/struct.proto";
message Filter { string column = 1; string op = 2; repeated google.protobuf.Value values = 3; }
message Sort { string column = 1; string direction = 2; }
message Query { int32 page = 1; int32 page_size = 2; repeated string search = 3; repeated string search_columns = 4; repeated Filter filters = 5; repeated Sort sort = 6; }
message Request { string resource = 1; string id_seq = 2; google.protobuf.Struct record = 3; Query query = 4; string token = 5; string ip = 6; string user_agent = 7; string row_version = 8; }
// Resource and column names are resolved against server-owned registries; SQL is never accepted.
service Directory {
 rpc A(Request) returns (google.protobuf.Struct);
 rpc U(Request) returns (google.protobuf.Struct);
 rpc D(Request) returns (google.protobuf.Struct);
 rpc Q(Request) returns (google.protobuf.Struct);
}
